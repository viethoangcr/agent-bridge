# CI for agent-bridge.
#
# Every action is pinned to a full 40-character commit SHA; tags, branches, and
# abbreviations are forbidden. The checks and host-architecture Docker E2E jobs
# run on pull requests and pushes to main. The non-publishing two-architecture
# build runs only on pushes to main, the weekly schedule, and manual dispatch.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8"
          check-latest: false
      - name: Verify the exact Go toolchain
        run: test "$(go env GOVERSION)" = go1.26.8
      - name: Detect formatting drift
        run: test -z "$(gofmt -l cmd internal tests)"
      - name: Detect module tidy drift
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Vet, unit, and race checks
        run: |
          go vet -tags=e2e ./...
          go test ./... -count=1
          go test -race -skip 'TestRealHeartbeat15Seconds' ./... -count=1
      - name: Pinned static analysis and vulnerability scan
        run: |
          go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 -tags=e2e ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -tags=e2e ./...
      - name: Static builds and ELF inspection
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/agent-bridge ./cmd/agent-bridge
          readelf -h /tmp/agent-bridge | grep -q 'Advanced Micro Devices X86-64'
          ! readelf -l /tmp/agent-bridge | grep -q INTERP
          ! readelf -d /tmp/agent-bridge | grep -q NEEDED
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/agent-bridge-arm64 ./cmd/agent-bridge
          readelf -h /tmp/agent-bridge-arm64 | grep -q 'AArch64'

  docker-e2e:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.8"
          check-latest: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the host image and verify the runtime contract
        run: |
          docker buildx build --load --platform "linux/$(go env GOARCH)" \
            -f docker/runtime/Dockerfile -t agent-bridge:ci .
          scripts/verify-agents.sh --image agent-bridge:ci
      - name: Generate an ephemeral test token
        # The suite mints its own per-container tokens; this masked value backs
        # any step that falls back to AGENT_BRIDGE_TOKEN and never reaches logs.
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "AGENT_BRIDGE_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Keyless and mock Docker E2E
        run: go test -tags=e2e ./tests/e2e -count=1 -timeout=20m

  multiarch:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build both architectures to an OCI archive
        # The Dockerfile binary-verify stage fails the build unless each
        # platform's binary reports the target ELF machine, so a successful
        # two-platform build is the target-architecture gate. Nothing is pushed.
        run: |
          rm -f /tmp/agent-bridge.oci
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f docker/runtime/Dockerfile \
            --output type=oci,dest=/tmp/agent-bridge.oci .
      - name: Verify both OCI manifest entries
        run: |
          test -s /tmp/agent-bridge.oci
          tar -tf /tmp/agent-bridge.oci
          tar -xOf /tmp/agent-bridge.oci index.json > /tmp/agent-bridge-index.json
          python3 - <<'PY'
          import json

          with open("/tmp/agent-bridge-index.json") as f:
              index = json.load(f)
          arches = {
              m["platform"]["architecture"]
              for m in index.get("manifests", [])
              if m.get("platform")
          }
          missing = {"amd64", "arm64"} - arches
          if missing:
              raise SystemExit(
                  "OCI index missing architectures: %s (got %s)"
                  % (sorted(missing), sorted(arches))
              )
          print("OCI manifest architectures:", sorted(arches))
          PY
